[workspace]
members = [
    "core",
    "cli",
    "gui/src-tauri"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Asiri Developers"]

[workspace.dependencies]
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
hex = "0.4"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
